<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xynapse Hub | Key System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 3rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 90%;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        h1 {
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
            font-size: 2rem;
            text-transform: uppercase;
        }

        p.subtitle {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .key-box {
            background: #fff;
            color: #000;
            padding: 1rem;
            border-radius: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: 600;
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            word-break: break-all;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .key-box:active {
            background: #e0e0e0;
        }

        .copy-btn {
            background: transparent;
            color: #fff;
            border: 1px solid #fff;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .copy-btn:hover {
            background: #fff;
            color: #000;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #fff;
            color: #000;
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>XYNAPSE</h1>
        <p class="subtitle">Sua chave de acesso ao script</p>
        
        <div class="key-box" id="keyDisplay" onclick="copyKey()">
            ydudhydbnd
        </div>

        <button class="copy-btn" onclick="copyKey()">Copiar Key</button>

        <div class="footer">Xynapse Hub © 2026</div>
    </div>

    <div id="toast" class="toast">Key copiada com sucesso!</div>

    <script>
        function copyKey() {
            const key = "ydudhydbnd";
            navigator.clipboard.writeText(key).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            });
        }
    </script>
</body>
</html>
